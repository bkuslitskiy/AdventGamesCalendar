name = "advent"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

# Production deployments (main) and `wrangler pages dev`.
[[d1_databases]]
binding = "DB"
database_name = "advent"
database_id = "REPLACE_WITH_ADVENT_DATABASE_ID" # npx wrangler d1 create advent
migrations_dir = "migrations"

# Every preview deployment (any branch other than main). Never touches babe's log.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "advent-preview"
database_id = "REPLACE_WITH_ADVENT_PREVIEW_DATABASE_ID" # npx wrangler d1 create advent-preview
migrations_dir = "migrations"

# Secrets are set outside this file (dashboard or `npx wrangler pages secret put NAME`):
#   ADMIN_TOKEN  bearer token for /#/admin and /api/admin/*
#   NTFY_URL     full ntfy topic URL for solve pings, e.g. https://ntfy.sh/<random-topic>
#   ADVENT_NOW   optional, preview only: pretend the clock reads this ISO time (play-testing)
#   ADVENT_EARLY_ACCESS  optional: "1" opens every day until Dec 1, "0" keeps the gate.
#                        Unset, it is on for preview branches (drafts bundled) and off on main.
